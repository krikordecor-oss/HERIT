<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>HERIT Lens — Targeting Engine 0.2</title>
</head>
<body>
  <video id="camera" autoplay playsinline muted></video>
  <div class="scrim"></div>

  <header>
    <div class="brand">HERIT <span>Lens</span></div>
    <div class="badge" id="sensorStatus">Capteurs arrêtés</div>
  </header>

  <main>
    <div class="reticle"><span></span></div>

    <section class="card">
      <div class="eyebrow">BÂTIMENT VISÉ</div>
      <div class="target" id="targetName">—</div>
      <div class="meta" id="targetMeta">Démarre les capteurs pour commencer.</div>
      <div class="metrics">
        <div><small>GPS</small><strong id="gps">—</strong></div>
        <div><small>CAP</small><strong id="heading">—</strong></div>
        <div><small>PRÉCISION</small><strong id="accuracy">—</strong></div>
        <div><small>RNB</small><strong id="rnbStatus">—</strong></div>
      </div>
      <button id="startBtn">Démarrer HERIT Lens</button>
      <button id="reloadBtn" class="secondary">Recharger les bâtiments</button>
    </section>
  </main>

  <details class="debug">
    <summary>Debug moteur</summary>
    <pre id="debug"></pre>
  </details>

  <script type="module" src="app.js"></script>
</body>
</html>
