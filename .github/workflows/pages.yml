name: Deploy HERIT Lens to GitHub Pages
# Redeploy trigger for HERIT 3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HERIT Lens recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/herit-lens-v1.9-2026-10-02

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload HERIT Lens
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
